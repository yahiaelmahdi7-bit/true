name: "True"
options:
  bundleIdPrefix: net.prismlens
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_DEBUG_DYLIB: NO
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  "True":
    type: application
    platform: iOS
    sources:
      - path: "True"
        excludes: ["Info*.plist"]
      - path: ../Sources/TrueRemoteClient
      - ../Sources/TrueActivity/PaneActivityAttributes.swift
      - TrueActivity/PaneIntents.swift
    dependencies:
      - package: SwiftTerm
      - target: TrueShare
        embed: true
      - target: TrueActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prismlens.true
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: True/Info.plist
        CODE_SIGN_ENTITLEMENTS: True/True.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "True"
        INFOPLIST_KEY_NSCameraUsageDescription: "True scans the pairing code shown on your Mac, and sends the photo you take to the pane on your Mac."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "True uses Bluetooth only to find your Mac when you first pair."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "True sends screenshots you take on this phone to your Mac."
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          INFOPLIST_FILE: True/Info-Debug.plist
  TrueShare:
    type: app-extension
    platform: iOS
    sources:
      - TrueShare
      - path: ../Sources/TrueRemoteClient
      - True/Services/KeychainTokenStore.swift
      - True/Services/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prismlens.true.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TrueShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueShare/TrueShare.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Send to True
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    # shares KeychainTokenStore + SharedConfig with the app
  TrueActivity:
    type: app-extension
    platform: iOS
    sources:
      - TrueActivity
      - path: ../Sources/TrueRemoteClient
      - ../Sources/TrueActivity/PaneActivityAttributes.swift
      - True/Services/KeychainTokenStore.swift
      - True/Services/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prismlens.true.activity
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TrueActivity/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: True
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  TrueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TrueUITests]
    dependencies:
      - target: "True"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prismlens.true.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  "True":
    build: { targets: { "True": all, TrueUITests: [test] } }
    run: { config: Debug }
    test: { targets: [TrueUITests] }
