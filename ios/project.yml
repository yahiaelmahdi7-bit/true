name: "True"
options:
  bundleIdPrefix: net.prismlens
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  "True":
    type: application
    platform: iOS
    sources:
      - True
      - path: ../Sources/TrueRemoteClient
    dependencies:
      - package: SwiftTerm
      - target: TrueShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prismlens.true
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: True/Info.plist
        CODE_SIGN_ENTITLEMENTS: True/True.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: True
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          INFOPLIST_FILE: True/Info-Debug.plist
  TrueShare:
    type: app-extension
    platform: iOS
    sources:
      - TrueShare
      - path: ../Sources/TrueRemoteClient
      - True/Services/KeychainTokenStore.swift
      - True/Services/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prismlens.true.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TrueShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueShare/TrueShare.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Send to True
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    # shares KeychainTokenStore + SharedConfig with the app
schemes:
  "True":
    build: { targets: { "True": all } }
    run: { config: Debug }
