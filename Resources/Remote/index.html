<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="True">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/app.css">
<title>True</title>
</head>
<body>
<div id="banner" role="status" hidden></div>

<main id="pair" aria-label="Pair this phone" hidden>
  <h1>Pair this phone</h1>
  <p>On the Mac: Shell ▸ Remote Access… Type the 6-digit code shown there.</p>
  <div id="pairErr" class="err" role="alert" hidden></div>
  <form id="pairForm"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-label="Pairing code"><button type="submit" class="send">Pair</button></form>
</main>

<main id="list" aria-label="Panes">
  <header class="bar"><h1>True</h1><span id="clock"></span></header>
  <div id="tabs"></div>
  <p id="empty" hidden>No panes open on the Mac.</p>
</main>

<section id="term" hidden aria-label="Terminal">
  <header class="bar">
    <button id="back" class="btn" aria-label="Back to panes">‹ Panes</button>
    <span id="paneTitle"></span>
    <button id="fit" class="btn" aria-pressed="true" aria-label="Fit width">Fit</button>
  </header>
  <div id="screen"><div id="xt"></div></div>
  <footer id="keys">
    <div class="row">
      <button class="k" data-k="esc">Esc</button>
      <button class="k" data-k="tab">Tab</button>
      <button class="k" id="ctrl" aria-pressed="false">Ctrl</button>
      <button class="k" data-k="up" aria-label="Up">↑</button>
      <button class="k" data-k="down" aria-label="Down">↓</button>
      <button class="k" data-k="left" aria-label="Left">←</button>
      <button class="k" data-k="right" aria-label="Right">→</button>
      <button class="k" data-k="cc">⌃C</button>
      <button class="k" id="paste">Paste</button>
    </div>
    <form id="line" autocomplete="off">
      <input id="text" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type a line, then Send" aria-label="Line to send">
      <button class="k send" type="submit">Send</button>
    </form>
  </footer>
</section>

<script src="/xterm.js"></script>
<script src="/app.js"></script>
</body>
</html>
